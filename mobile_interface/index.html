<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Interface Móvel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-F5uBWJKm/kQqYklI0+9RAewgQHwt56xMK7Dw2hiX5YIbMGw0WV+QGQgpQKOy38P7" crossorigin="anonymous">
</head>
<body class="container py-3">
    <h1 class="mb-3">Chamados</h1>
    <div class="mb-3">
        <input type="text" id="clientCode" class="form-control" placeholder="Código do cliente">
        <button id="loadCalls" class="btn btn-primary mt-2">Carregar Chamados</button>
    </div>
    <ul id="calls" class="list-group"></ul>

    <h2 class="mt-4">Detalhes do Chamado</h2>
    <div id="ticketDetails" class="card p-3"></div>

    <h2 class="mt-4">Criar Ficha de Atendimento</h2>
    <div class="mb-3">
        <input type="text" id="formClient" class="form-control" placeholder="Código do cliente">
        <input type="text" id="formSubject" class="form-control mt-2" placeholder="Assunto">
        <textarea id="formDescription" class="form-control mt-2" placeholder="Descrição"></textarea>
        <button id="createForm" class="btn btn-success mt-2">Enviar</button>
    </div>
    <ul id="forms" class="list-group"></ul>

    <script src="app.js"></script>
</body>
</html>
